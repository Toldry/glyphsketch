name: Release

# Publishes the Kotlin library to Maven Central as io.github.toldry:glyphsketch when a
# version tag (v0.1.0) is pushed. The upload waits in the Central Portal
# (https://central.sonatype.com/publishing) until someone presses Publish.
# Secrets (repository settings → Secrets and variables → Actions): MAVEN_CENTRAL_USERNAME and
# MAVEN_CENTRAL_PASSWORD (a Central Portal user token), SIGNING_KEY (an armored PGP private
# key) and SIGNING_KEY_PASSWORD.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Lint and test (parity with export/fixtures.json)
        run: ./gradlew lintKotlin :glyphsketch:testDebugUnitTest --console=plain
      - name: Sign and upload
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :glyphsketch:publishToMavenCentral -PVERSION_NAME="$VERSION" --console=plain
