[project]
name = "glyphsketch"
version = "0.1.0"
description = "Training pipeline for an offline handwritten Unicode character recognizer."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphsketch"]

[tool.uv]
required-version = ">=0.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "N",    # pep8 naming
    "ANN",  # type annotations everywhere
    "SIM",  # simplifications
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # `Any` is sometimes the honest type (e.g. JSON)
    "RUF001",  # look-alike characters are this project's subject matter
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "data: needs downloaded data in $DATA_DIR; skipped when it is missing",
]
