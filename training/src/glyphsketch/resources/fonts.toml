# Fonts used to render glyphs. Every file is pinned by SHA-256, and so is its license text.
#
# Google Fonts files come from a fixed commit of https://github.com/google/fonts; the OFL.txt
# next to each family was read to confirm its license (and every METADATA.pb says "OFL").
# DejaVu, GNU FreeFont and Libertinus come from their upstream release archives.
#
# `style` is used to balance training data and in reports:
#   sans, serif, mono  - text faces
#   handwriting        - informal or handwriting-like faces (closest to drawn input)
#   math, symbols      - specialist coverage fonts
#
# Noto Emoji is the monochrome (outline) emoji font, the only kind a drawing can be
# compared with; colour emoji fonts are not used (DECISIONS.md, D34 replaces D8).
# Deliberately not used: DejaVu Math TeX Gyre (mixed Bitstream/AMS terms, and four other math fonts cover the
# same characters); GNU Unifont (a 16x16 bitmap design; the characters only it covers are
# brand-new ones that devices can't display yet); small-caps and decorative faces.

